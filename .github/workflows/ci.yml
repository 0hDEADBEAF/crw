name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo doc --workspace --all-features --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo test --workspace --all-features --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: >-
          cargo llvm-cov --lib --workspace --all-features --locked --show-missing-lines
          --fail-under-functions 100 --fail-under-lines 100 --fail-under-regions 100

  commits:
    name: Every commit compiles
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Compile every commit of the pull request
        run: |
          failed=()
          for rev in $(git rev-list --reverse "$BASE..HEAD"); do
            echo "::group::$(git log -1 --format='%h %s' "$rev")"
            git checkout --quiet --detach "$rev"
            cargo check --workspace --all-targets --all-features --locked || failed+=("$rev")
            echo "::endgroup::"
          done
          for rev in "${failed[@]}"; do
            echo "::error::Commit $rev does not compile."
          done
          [[ ${#failed[@]} -eq 0 ]]
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: pipx install commitizen==4.19.3
      - run: cz check --rev-range "$BASE..HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  result:
    name: CI result
    if: always()
    needs: [fmt, clippy, doc, test, coverage, commits, messages]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
